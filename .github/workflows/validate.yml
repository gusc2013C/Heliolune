name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ripgrep
        shell: powershell
        run: choco install ripgrep -y --no-progress
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\validate-release.ps1
      - name: Validate with PowerShell 7
        shell: pwsh
        run: .\scripts\validate-release.ps1
      - name: Package and validate an extracted release in a clean clone
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'heliolune-release-smoke'
          if (Test-Path -LiteralPath $smokeRoot) { Remove-Item -LiteralPath $smokeRoot -Recurse -Force }
          git clone --no-hardlinks $env:GITHUB_WORKSPACE $smokeRoot
          git -C $smokeRoot switch --force-create main
          New-Item -ItemType Directory -Path (Join-Path $smokeRoot 'dist') -Force | Out-Null
          & (Join-Path $smokeRoot 'scripts\package-release.ps1') -OutputDirectory (Join-Path $smokeRoot 'dist')
          if ($LASTEXITCODE -ne 0) { throw 'Clean-clone release packaging smoke failed.' }
