name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\validate-release.ps1
      - name: Validate with PowerShell 7
        shell: pwsh
        run: .\scripts\validate-release.ps1
